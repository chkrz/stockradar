<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="sweepG" x1="16" y1="16" x2="29" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- radar rings -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="#58a6ff" stroke-opacity=".75" stroke-width="1.8"/>
  <circle cx="16" cy="16" r="7.5" fill="none" stroke="#58a6ff" stroke-opacity=".4" stroke-width="1.4"/>

  <!-- sweep wedge -->
  <path d="M16 16 L16 2.5 A13.5 13.5 0 0 1 27.5 9 Z" fill="url(#sweepG)"/>

  <!-- sweep line -->
  <line x1="16" y1="16" x2="16" y2="2.5" stroke="#79c0ff" stroke-width="2" stroke-linecap="round"/>

  <!-- blips -->
  <circle cx="22.5" cy="11" r="3.2" fill="#7ee787"/>
  <circle cx="9.5" cy="21.5" r="2.1" fill="#58a6ff"/>
  <circle cx="20.5" cy="23" r="1.5" fill="#f0883e"/>

  <!-- center -->
