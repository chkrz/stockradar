<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="sweep" x1="16" y1="16" x2="28" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0d1117"/>

  <!-- radar rings -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#1f6feb" stroke-opacity=".45" stroke-width="1.4"/>
  <circle cx="16" cy="16" r="6.5" fill="none" stroke="#1f6feb" stroke-opacity=".35" stroke-width="1.2"/>

  <!-- sweep wedge -->
  <path d="M16 16 L16 5 A11 11 0 0 1 25.5 10.5 Z" fill="url(#sweep)"/>

  <!-- sweep line -->
  <line x1="16" y1="16" x2="16" y2="5" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- blips -->
  <circle cx="21.5" cy="12" r="2.6" fill="#7ee787"/>
  <circle cx="11" cy="21" r="1.7" fill="#58a6ff" fill-opacity=".8"/>
  <circle cx="20" cy="22.5" r="1.2" fill="#f0883e" fill-opacity=".85"/>

  <!-- center -->
  <circle cx="16" cy="16" r="1.5" fill="#c9d1d9"/>
</svg>
