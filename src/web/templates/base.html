<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<title>{% block title %}StockRadar{% endblock %}</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; }
a { color: #58a6ff; text-decoration: none; }
a:hover { text-decoration: underline; }

nav { padding: 14px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #21262d; background: #0d1117; }
nav .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
nav .logo .wordmark { color: #fff; }
nav .logo .wordmark span { color: #58a6ff; }
nav .links { display: flex; gap: 24px; }
nav .links a { color: #8b949e; text-decoration: none; font-size: 14px; font-weight: 500; padding: 4px 0; border-bottom: 2px solid transparent; transition: all 0.2s; }
nav .links a:hover { color: #fff; text-decoration: none; }
nav .links a.active { color: #fff; border-bottom-color: #58a6ff; }

.main { padding: 24px 32px; max-width: 1100px; margin: 0 auto; }
.page-title { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
.stats { font-size: 13px; color: #8b949e; margin-bottom: 16px; }

.card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
.badge-bullish { background: #1a3a2a; color: #7ee787; }
.badge-bearish { background: #3a1a1a; color: #f85149; }
.badge-neutral { background: #2a2a1a; color: #d29922; }
.summary-text { font-size: 14px; line-height: 1.6; color: #c9d1d9; }
.meta { font-size: 13px; color: #8b949e; margin-top: 8px; }
.meta span { margin-right: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.tweet-content { font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

.topbar { display: flex; gap: 12px; margin-bottom: 20px; }
.topbar input[type=text] { flex: 1; padding: 8px 14px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; font-size: 14px; }
.topbar button { padding: 8px 16px; border-radius: 6px; border: none; background: #238636; color: #fff; cursor: pointer; font-size: 14px; }
.pagination { margin-top: 20px; display: flex; gap: 8px; }
.pagination a { padding: 6px 12px; border-radius: 4px; background: #21262d; color: #c9d1d9; text-decoration: none; font-size: 13px; }
.pagination a.current { background: #238636; color: #fff; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; color: #8b949e; text-transform: uppercase; padding: 8px 12px; border-bottom: 1px solid #30363d; }
td { padding: 10px 12px; border-bottom: 1px solid #21262d; font-size: 14px; }
tr:hover { background: #161b22; }
</style>
</head>
<body>
<nav>
  <a href="/" class="logo" style="text-decoration:none;">
    <img src="/static/favicon.svg" alt="" width="34" height="34">
    <span class="wordmark">Stock<span>Radar</span></span>
  </a>
  <div class="links">
    <a href="/market" class="{% block nav_sp500 %}{% endblock %}">S&P 500</a>
    <a href="/market/cn" class="{% block nav_hs300 %}{% endblock %}">HS300</a>
    <a href="/stocks" class="{% block nav_insights %}{% endblock %}">Insights</a>
    <a href="/tweets" class="{% block nav_feed %}{% endblock %}">Feed</a>
  </div>
</nav>
<div class="main">
  {% block content %}{% endblock %}
</div>
</body>
</html>
