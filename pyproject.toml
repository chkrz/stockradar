[project]
name = "stockradar"
version = "0.1.0"
description = "Investment intelligence radar — Twitter KOL tracking + market visualization"
requires-python = ">=3.11"

dependencies = [
    "twscrape>=0.17",
    "python-dotenv>=1.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "jinja2>=3.1",
    "httpx>=0.24",
    "pandas>=2.0",
    "lxml>=5.0",
    "yfinance>=0.2",
    "akshare>=1.10",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[dependency-groups]
dev = [
    "ruff",
]
